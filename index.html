<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Golf Log">
<meta name="theme-color" content="#F9F9F6">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Golf Log</title>
<style>
:root{
  --paper:#F9F9F6; --card:#FFFFFF; --ink:#182119; --mute:#6A716C; --line:#E1E4DE;
  --green:#1F6B3E; --green-soft:#E4EFE7; --red:#B0392E; --red-soft:#F7E6E3;
  --amber:#A8701A; --amber-soft:#F6ECD9; --tap:54px; --r:12px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{padding-top:var(--sat);-webkit-user-select:none;user-select:none}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
#app{padding:12px 14px calc(76px + var(--sab));max-width:560px;margin:0 auto;min-height:100vh}
h1{font-size:26px;font-weight:700;margin:6px 0 14px;letter-spacing:-0.02em}
h2{font-size:17px;font-weight:600;margin:20px 0 8px}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.flat{border:0;background:none;padding:0;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:8px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:var(--red);border-style:dashed;background:none}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;font-weight:600}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.stack{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:#ECEEEA;border-radius:10px;padding:3px}
.seg button{flex:1;min-height:40px;border-radius:8px;font-weight:600;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.in{width:100%;min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
textarea.in{min-height:80px;padding:10px 12px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.badge.real{background:var(--green-soft);color:var(--green)}
.badge.sim{background:var(--amber-soft);color:var(--amber)}
.badge.gray{background:#ECEEEA;color:var(--mute)}
.badge.red{background:var(--red-soft);color:var(--red)}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list .item:last-child{border-bottom:0}
.empty{padding:30px 16px;text-align:center;color:var(--mute)}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(247,247,244,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--sab);z-index:5}
#tabs button{flex:1;min-height:60px;font-size:11px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#tabs button.on{color:var(--green)}
#tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* hole screen */
.holehead{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 0 12px}
.holehead .hn{font-size:60px;line-height:.9;font-weight:800;letter-spacing:-0.05em}
.holehead .meta{color:var(--mute);font-size:14px;margin-top:4px}
.holehead .score{text-align:right}
.holehead .score b{font-size:44px;line-height:1;font-weight:800;letter-spacing:-0.03em;display:block}
.holehead .score span{font-size:13px;color:var(--mute)}
.nav{display:flex;gap:8px;margin:0 0 12px}
.nav .btn{flex:1}
.shotrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.shotrow .idx{width:22px;color:var(--mute);font-size:13px}
.shotrow .club{font-weight:700;width:44px}
.shotrow .res{flex:1}
.shotrow .res.good{color:var(--green)} .shotrow .res.pen{color:var(--red)}
.shotrow .det{font-size:12px;color:var(--mute)}
.shotrow button.x{min-width:40px;min-height:40px;color:var(--mute);font-size:20px}
.clubs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.clubs button{min-height:46px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px}
.clubs button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.target{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.target button{min-height:58px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:16px}
.target .good{background:var(--ink);color:#fff;border-color:var(--ink)}
.target .pen{grid-column:1/4;background:none;color:var(--red);border:1px dashed var(--red);min-height:44px}
.target .ph{visibility:hidden}
.step{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.step .ctl{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step .ctl button{width:52px;height:46px;font-size:24px;font-weight:500}
.step .ctl b{width:44px;text-align:center;font-size:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button.on.bad{background:var(--red);border-color:var(--red)}
.chips button.on.good{background:var(--green);border-color:var(--green)}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-0.03em}
.kpi span{font-size:12px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--mute);font-size:12px}
th:first-child,td:first-child{text-align:left}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sheet{position:fixed;inset:0;background:rgba(22,36,28,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet .pane{background:var(--paper);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + var(--sab));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--sab));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.btn:not(.green):not(.primary) .spin{border-color:#d0d5cf;border-top-color:var(--ink)}
.holes-grid{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;align-items:center;font-size:14px}
.holes-grid input{min-height:40px;padding:0 8px;text-align:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--green)} .dot.wait{background:var(--amber)}
/* scorecard notation: circle=birdie, double circle=eagle (bold), square=bogey, double square=double+ (bold) */
.mark{position:relative;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.mark::before,.mark::after{content:"";position:absolute;border:1.5px solid transparent;pointer-events:none}
.mark.b,.mark.bb{color:var(--green)} .mark.o,.mark.oo{color:var(--red)} .mark.e{color:var(--mute)}
.mark.b::after,.mark.bb::after,.mark.bb::before{border-color:var(--green);border-radius:50%}
.mark.o::after,.mark.oo::after,.mark.oo::before{border-color:var(--red);border-radius:2px}
.mark.b::after,.mark.o::after{inset:1px}
.mark.bb::after,.mark.oo::after{inset:-1px} .mark.bb::before,.mark.oo::before{inset:3px}
.mark.bb,.mark.oo{font-weight:800}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:0 0 14px}
.strip button{aspect-ratio:1;border:1px solid var(--line);border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.strip button.cur{border:2px solid var(--ink)}
.strip .mark{width:22px;height:22px;font-size:13px}
.scoretbl .mark{width:24px;height:24px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs"></nav>
<div class="toast" id="toast"></div>
<script>
/* ===================== storage ===================== */
const K='golflog.v2';
const DEF_CLUBS=['Dr','3W','Hy','4i','5i','6i','7i','8i','9i','PW','50','54','58'];
const RESULTS={good:'Good',left:'Left',right:'Right',short:'Short',long:'Long',pen:'Penalty'};
const LIES=['Tee','Fairway','Rough','Sand','Fringe','Recovery'];
const STRIKES=['Center','Heel','Toe','Thin','Fat'];
let DB={rounds:[],courses:[],players:[],games:[],active:null,activeGame:null,settings:{clubs:DEF_CLUBS.slice(),sheetUrl:'',defaultMode:'shots',defaultType:'Real'}};
function load(){try{const s=localStorage.getItem(K);if(s){const d=JSON.parse(s);DB={...DB,...d,settings:{...DB.settings,...(d.settings||{})}}}}catch(e){}
  DB.courses=(DB.courses||[]).map(migrateCourse);DB.players=DB.players||[];DB.games=DB.games||[]}
/* old shape: {name, rating, slope, holes:[{par,yds}]}  →  new: {name, pars:[18], tees:[{id,name,rating,slope,yds:[18]}]} */
function migrateCourse(c){if(c.tees)return c;
  const m=/^(.*?)\s+[–-]\s+(.+)$/.exec(c.name||'');const name=m?m[1]:c.name,tee=m?m[2]:'Default';
  const holes=c.holes||Array.from({length:18},()=>({par:4,yds:0}));
  return {id:c.id,name,pars:holes.map(h=>h.par||4),si:holes.map((h,i)=>h.si||i+1),tees:[{id:uid(),name:tee,rating:c.rating||null,slope:c.slope||null,yds:holes.map(h=>h.yds||0)}]}}
function coursePar(c){return (c.pars||[]).reduce((a,b)=>a+b,0)}
function courseSI(c){return (c&&c.si&&c.si.length===18)?c.si:Array.from({length:18},(_,i)=>i+1)}
function teeYds(t){return (t.yds||[]).reduce((a,b)=>a+(b||0),0)}
function save(){try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){toast('Could not save — storage full?')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;function toast(m,sticky){const t=document.getElementById('toast');t.innerHTML=(sticky?'<span class="spin"></span>':'')+esc(m);t.classList.add('show');clearTimeout(toastT);if(!sticky)toastT=setTimeout(()=>t.classList.remove('show'),2400)}
const fmtPar=n=>n===0?'E':(n>0?'+'+n:String(n));
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'–';
const fx=(n,d=1)=>n==null||isNaN(n)?'–':n.toFixed(d);

/* ===================== hole math ===================== */
function penalties(h){return (h.shots||[]).filter(s=>s.result==='pen').length + (h.mode==='quick'?(h.pen||0):0)}
function holeCalc(h){
  const isShots=h.mode==='shots';
  const shots=h.shots||[];
  const pen=isShots?shots.filter(s=>s.result==='pen').length:(h.pen||0);
  const putts=h.putts||0;
  let score,fir,gir;
  if(isShots){
    score=shots.length+pen+putts;
    if(h.par>=4&&shots.length){const r=shots[0].result;fir=r==='good'?'hit':(r==='left'||r==='right')?r:'miss'}else fir=null;
    gir=shots.length? (shots.length+pen)<=h.par-2 : null;
  }else{
    score=h.score||h.par||0;
    fir=h.par>=4?(h.fir||null):null;
    gir=h.gir==null?null:!!h.gir;
  }
  const logged=isShots?shots.length>0:(!!h.touched||(h.score||0)>0);
  if(!logged)score=0;
  const scr=(gir===false&&logged)?(score<=h.par):null;
  let girMiss=null;
  if(gir===false){if(isShots){const i=h.par-2-pen-1;const a=i>=0?shots[i]:shots[0];if(a)girMiss=a.result==='good'?null:a.result}else girMiss=h.girMiss||null}
  return {score,pen,putts,fir,gir,scr,logged,toPar:score-h.par,girMiss};
}
function markCls(toPar){return toPar<=-2?'bb':toPar===-1?'b':toPar===0?'e':toPar===1?'o':'oo'}
function markHtml(h){const c=holeCalc(h);return c.logged?`<span class="mark ${markCls(c.toPar)}">${c.score}</span>`:'<span class="mark"></span>'}
function stripHtml(r,cur,onclick){return `<div class="strip">${r.holes.map((h,i)=>`<button class="${i===cur?'cur':''}" ${onclick?`onclick="${onclick}(${i})"`:''} aria-label="Hole ${h.n}">${markHtml(h)}</button>`).join('')}</div>`}
function jumpHole(i){sub.club=null;sub.detail=null;DB.active.cur=i;save();render()}
function roundCalc(r){
  const hs=r.holes.map(h=>({h,c:holeCalc(h)})).filter(x=>x.c.logged);
  const t={holes:hs.length,score:0,par:0,putts:0,pen:0,firH:0,firO:0,girH:0,girO:0,scrH:0,scrO:0,threeP:0};
  hs.forEach(({h,c})=>{t.score+=c.score;t.par+=h.par;t.putts+=c.putts;t.pen+=c.pen;
    if(c.fir){t.firO++;if(c.fir==='hit')t.firH++}
    if(c.gir!=null){t.girO++;if(c.gir)t.girH++}
    if(c.scr!=null){t.scrO++;if(c.scr)t.scrH++}
    if(c.putts>=3)t.threeP++});
  t.toPar=t.score-t.par;
  t.diff=(t.holes===18&&r.rating&&r.slope)?Math.round((t.score-r.rating)*113/r.slope*10)/10:null;
  return t;
}
/* WHS handicap index estimate from differentials (most recent first): best N of last 20 with the small-sample table */
function handicapIndex(diffs){const d=diffs.slice(0,20);const n=d.length;if(n<3)return null;
  const N=n<=5?1:n<=8?2:n<=11?3:n<=14?4:n<=16?5:n<=18?6:n===19?7:8;const adj=n===3?-2:n===4?-1:n===6?-1:0;
  const best=[...d].sort((a,b)=>a-b).slice(0,N);return Math.round((best.reduce((a,b)=>a+b,0)/N+adj)*10)/10}
function newHoles(course,tee,start,count){
  const hs=[];for(let i=0;i<count;i++){const n=start+i;
    hs.push({n,par:course?(course.pars[n-1]||4):4,yds:tee?(tee.yds[n-1]||0):0,mode:DB.active?.mode||'shots',shots:[],putts:0,score:0,fir:null,gir:null,girMiss:null,pen:0,touched:false})}
  return hs;
}

/* ===================== router ===================== */
let view='play',sub={};
const ICONS={
  play:'<svg viewBox="0 0 24 24"><path d="M6 20V4l10 4-10 4"/><path d="M4 20h6"/></svg>',
  rounds:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  stats:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>',
  courses:'<svg viewBox="0 0 24 24"><path d="M12 22s-7-6-7-12a7 7 0 0 1 14 0c0 6-7 12-7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  games:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'};
function go(v,s={}){view=v;sub=s;render();window.scrollTo(0,0)}
function render(){
  document.getElementById('tabs').innerHTML=['play','rounds','games','stats','courses','settings'].map(v=>`<button class="${view===v?'on':''}" onclick="go('${v}')">${ICONS[v]}<span>${v[0].toUpperCase()+v.slice(1)}</span></button>`).join('');
  const app=document.getElementById('app');
  app.innerHTML=({play:vPlay,rounds:vRounds,games:vGames,stats:vStats,courses:vCourses,settings:vSettings})[view]();
}

/* ===================== PLAY ===================== */
function vPlay(){
  if(DB.active) return vHole();
  const cs=DB.courses;
  const f=sub.form||(sub.form={date:today(),courseId:cs[0]?.id||'',type:DB.settings.defaultType,mode:DB.settings.defaultMode,span:'18'});
  return `<h1>New round</h1>
  <div class="card">
    <label class="f">Course</label>
    <select class="in" onchange="sub.form.courseId=this.value;sub.form.teeId=null;render()">${cs.length?cs.map(c=>`<option value="${c.id}" ${c.id===f.courseId?'selected':''}>${esc(c.name)}</option>`).join(''):'<option value="">No courses yet</option>'}</select>
    ${(()=>{const c=cs.find(x=>x.id===f.courseId);if(!c||!c.tees.length)return '';if(!f.teeId||!c.tees.find(t=>t.id===f.teeId))f.teeId=c.tees[0].id;
      return c.tees.length===1?`<p class="sub" style="margin:6px 0 0">${esc(c.tees[0].name)} tees${c.tees[0].rating?' · '+c.tees[0].rating+' / '+c.tees[0].slope:''}</p>`
      :`<label class="f">Tees</label><div class="seg">${c.tees.map(t=>`<button class="${t.id===f.teeId?'on':''}" onclick="sub.form.teeId='${t.id}';render()">${esc(t.name)}</button>`).join('')}</div>`})()}
    ${cs.length?'':'<p class="sub" style="margin:8px 0 0">Add a course in the Courses tab first, or start without one (par 4s, edit as you go).</p>'}
    <label class="f">Date</label><input class="in" type="date" value="${f.date}" onchange="sub.form.date=this.value">
    <label class="f">Round type</label>
    <div class="seg"><button class="${f.type==='Real'?'on':''}" onclick="sub.form.type='Real';render()">Real</button><button class="${f.type==='Sim'?'on':''}" onclick="sub.form.type='Sim';render()">Simulator</button></div>
    <label class="f">Entry</label>
    <div class="seg"><button class="${f.mode==='shots'?'on':''}" onclick="sub.form.mode='shots';render()">Every shot</button><button class="${f.mode==='quick'?'on':''}" onclick="sub.form.mode='quick';render()">Quick</button></div>
    <p class="sub" style="margin:6px 0 0">${f.mode==='shots'?'Two taps per shot: club, then result. Details are optional.':'Score, putts, fairway, green, penalties per hole.'}</p>
    <label class="f">Holes</label>

/* ===================== PUSH TO SHEETS ===================== */
function payload(r){const c=roundCalc(r);const base={roundId:r.id,date:r.date,course:r.courseName,type:r.type,mode:r.mode};
  const holes=[],shots=[];
  r.holes.forEach(h=>{const x=holeCalc(h);if(!x.logged)return;
    holes.push({...base,hole:h.n,par:h.par,yds:h.yds||'',score:x.score,toPar:x.toPar,putts:x.putts,pen:x.pen,fir:x.fir??'',gir:x.gir==null?'':(x.gir?1:0),scramble:x.scr==null?'':(x.scr?1:0),girMiss:x.girMiss||''});
    if(h.mode==='shots')h.shots.forEach((s,i)=>shots.push({...base,hole:h.n,par:h.par,shot:i+1,club:s.club,lie:s.lie||'',result:RESULTS[s.result],strike:s.strike||'',prox:s.prox??''}));
  });
  return {round:{...base,holes:c.holes,score:c.score,par:c.par,toPar:c.toPar,putts:c.putts,pen:c.pen,firHit:c.firH,firOpp:c.firO,girHit:c.girH,girOpp:c.girO,scrHit:c.scrH,scrOpp:c.scrO,threePutts:c.threeP,notes:r.notes||'',rating:r.rating??'',slope:r.slope??'',differential:c.diff??''},holes,shots};
}
const inflight=new Set();let syncing=false;
async function pushRound(r,quiet){
  const url=DB.settings.sheetUrl;if(!url){if(!quiet){toast('Add your Sheets script URL in Settings')}return false}
  if(!navigator.onLine){if(!quiet)toast('Offline — will push when you have signal');return false}
  if(inflight.has(r.id)){if(!quiet)toast('Still pushing that round…');return false}
  inflight.add(r.id);render();toast('Pushing '+r.courseName+' to Sheets…',true);
  try{
    const res=await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload(r))});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'Script error');
    r.pushed=true;r.pushedAt=Date.now();save();toast('Pushed to Sheets');return true;
  }catch(e){toast('Push failed: '+(e.message||'network'));return false}
  finally{inflight.delete(r.id);render()}
}
async function syncAll(quiet){if(syncing)return;syncing=true;let n=0;render();
  try{for(const r of DB.rounds.filter(x=>!x.pushed)){if(await pushRound(r,true))n++;else break}}finally{syncing=false}
  if(n||!quiet)toast(n?`Pushed ${n} round${n>1?'s':''}`:'Nothing pushed — check signal or Settings')}
let onlineT;window.addEventListener('online',()=>{clearTimeout(onlineT);onlineT=setTimeout(()=>{if(pendingCount()&&DB.settings.sheetUrl)syncAll(true)},4000)});
function copyCSV(id){const p=payload(DB.rounds.find(x=>x.id===id));
  const line=o=>Object.values(o).map(v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(',');
  const blk=(name,rows)=>rows.length?`# ${name}\n${Object.keys(rows[0]).join(',')}\n${rows.map(line).join('\n')}\n`:'';
  const txt=blk('Rounds',[p.round])+blk('Holes',p.holes)+blk('Shots',p.shots);
  navigator.clipboard?.writeText(txt).then(()=>toast('CSV copied'),()=>prompt('Copy this:',txt))}

/* ===================== STATS ===================== */
function vStats(){
  const f=sub.filter||'All';
  const rs=DB.rounds.filter(r=>f==='All'||r.type===f).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
  const seg=`<div class="seg" style="margin-bottom:12px">${['Real','Sim','All'].map(x=>`<button class="${f===x?'on':''}" onclick="sub.filter='${x}';render()">${x==='All'?'Combined':x==='Sim'?'Simulator':x}</button>`).join('')}</div>`;
  if(!rs.length)return `<h1>Stats</h1>${seg}<div class="card empty">No ${f==='All'?'':f.toLowerCase()+' '}rounds yet.</div>`;
  const T={holes:0,toPar:0,putts:0,pen:0,firH:0,firO:0,girH:0,girO:0,scrH:0,scrO:0,threeP:0,p3:[0,0],p4:[0,0],p5:[0,0]};
  const club={};let proxN=0,proxSum=0;
  const diffs=[];const gm={long:0,left:0,right:0,short:0,pen:0};let gmN=0;
  rs.forEach(r=>{const c=roundCalc(r);if(c.diff!=null)diffs.push(c.diff);T.holes+=c.holes;T.toPar+=c.toPar;T.putts+=c.putts;T.pen+=c.pen;T.firH+=c.firH;T.firO+=c.firO;T.girH+=c.girH;T.girO+=c.girO;T.scrH+=c.scrH;T.scrO+=c.scrO;T.threeP+=c.threeP;
    r.holes.forEach(h=>{const x=holeCalc(h);if(!x.logged)return;const k='p'+Math.min(5,Math.max(3,h.par));T[k][0]+=x.toPar;T[k][1]++;if(x.gir===false){gmN++;if(x.girMiss&&gm[x.girMiss]!=null)gm[x.girMiss]++}
      if(h.mode==='shots')h.shots.forEach(s=>{const o=club[s.club]||(club[s.club]={n:0,good:0,left:0,right:0,short:0,long:0,pen:0,heel:0,toe:0,proxN:0,proxSum:0});o.n++;o[s.result]++;if(s.strike==='Heel')o.heel++;if(s.strike==='Toe')o.toe++;if(s.prox!=null){o.proxN++;o.proxSum+=s.prox;proxN++;proxSum+=s.prox}})});
  });
  const per18=v=>T.holes?v/T.holes*18:null;
  const order=DB.settings.clubs;const clubs=Object.keys(club).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  return `<h1>Stats</h1>${seg}
  <p class="sub" style="margin:0 0 10px">${rs.length} round${rs.length>1?'s':''} · ${T.holes} holes</p>
  <div class="kpis">
    <div class="kpi"><b class="num">${per18(T.toPar)==null?'–':fmtPar(Math.round(per18(T.toPar)*10)/10)}</b><span>avg to par (18)</span></div>
    <div class="kpi"><b class="num">${fx(per18(T.putts))}</b><span>putts / 18</span></div>
    <div class="kpi"><b class="num">${fx(per18(T.pen))}</b><span>penalties / 18</span></div>
    <div class="kpi"><b class="num">${pct(T.firH,T.firO)}</b><span>fairways</span></div>
    <div class="kpi"><b class="num">${pct(T.girH,T.girO)}</b><span>greens</span></div>
    <div class="kpi"><b class="num">${pct(T.scrH,T.scrO)}</b><span>scrambling</span></div>
    <div class="kpi"><b class="num">${T.p3[1]?fmtPar(Math.round(T.p3[0]/T.p3[1]*100)/100):'–'}</b><span>par 3s</span></div>
    <div class="kpi"><b class="num">${T.p4[1]?fmtPar(Math.round(T.p4[0]/T.p4[1]*100)/100):'–'}</b><span>par 4s</span></div>
    <div class="kpi"><b class="num">${T.p5[1]?fmtPar(Math.round(T.p5[0]/T.p5[1]*100)/100):'–'}</b><span>par 5s</span></div>
    <div class="kpi"><b class="num">${diffs.length?fx(diffs.reduce((a,b)=>a+b,0)/diffs.length):'–'}</b><span>avg differential</span></div>
    <div class="kpi"><b class="num">${handicapIndex(diffs.slice().reverse())==null?'–':fx(handicapIndex(diffs.slice().reverse()))}</b><span>est. index${diffs.length?' ('+Math.min(20,diffs.length)+' rated)':''}</span></div>
    <div class="kpi"><b class="num">${diffs.length?fx(Math.min(...diffs)):'–'}</b><span>best differential</span></div>
  </div>
  ${gmN?`<h2>Missed greens <span class="sub" style="font-weight:400">${gmN} misses</span></h2><div class="card" style="padding:8px 14px"><div class="target" style="margin:0;gap:6px">
    <span class="ph"></span><div class="kpi" style="text-align:center"><b class="num">${pct(gm.long,gmN)}</b><span>long</span></div><span class="ph"></span>
    <div class="kpi" style="text-align:center"><b class="num">${pct(gm.left,gmN)}</b><span>left</span></div><div class="kpi" style="text-align:center;background:var(--paper)"><b class="num">${pct(gmN-gm.long-gm.left-gm.right-gm.short-gm.pen,gmN)}</b><span>not noted</span></div><div class="kpi" style="text-align:center"><b class="num">${pct(gm.right,gmN)}</b><span>right</span></div>
    <span class="ph"></span><div class="kpi" style="text-align:center"><b class="num">${pct(gm.short,gmN)}</b><span>short</span></div><span class="ph"></span></div>${gm.pen?`<p class="sub" style="margin:8px 0 0;font-size:12px">${gm.pen} missed because of a penalty</p>`:''}</div>`:''}

    ${clubs.map(k=>{const o=club[k];return `<tr><td><b>${esc(k)}</b></td><td>${o.n}</td><td>${pct(o.good,o.n)}</td><td>${o.left}</td><td>${o.right}</td><td>${o.short}</td><td>${o.long}</td><td>${o.pen||''}</td><td>${o.heel||''}</td><td>${o.toe||''}</td><td>${o.proxN?Math.round(o.proxSum/o.proxN):''}</td></tr>`}).join('')}</table></div>`:''}`;
}
function trendSvg(rs){
  const pts=rs.slice(-20).map(r=>{const c=roundCalc(r);return {v:c.holes?c.toPar/c.holes*18:0,t:r.type,d:r.date}});
  if(pts.length<2)return '<div class="sub" style="text-align:center;padding:14px">Trend shows after two rounds</div>';
  const W=320,H=120,pl=28,pr=8,pt=8,pb=18;let mn=Math.min(0,...pts.map(p=>p.v)),mx=Math.max(4,...pts.map(p=>p.v));mn=Math.floor(mn/2)*2;mx=Math.ceil(mx/2)*2;
  const x=i=>pl+i*(W-pl-pr)/(pts.length-1),y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const grid=[];for(let g=mn;g<=mx;g+=2)grid.push(`<line x1="${pl}" x2="${W-pr}" y1="${y(g)}" y2="${y(g)}" stroke="#E4E7E2"/><text x="${pl-4}" y="${y(g)+4}" font-size="9" fill="#6B7770" text-anchor="end">${fmtPar(g)}</text>`);
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="${p.t==='Sim'?'#A8701A':'#2E7A45'}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid.join('')}<path d="${path}" fill="none" stroke="#16241C" stroke-width="1.5"/>${dots}<text x="${pl}" y="${H-4}" font-size="9" fill="#6B7770">${pts[0].d}</text><text x="${W-pr}" y="${H-4}" font-size="9" fill="#6B7770" text-anchor="end">${pts[pts.length-1].d}</text></svg>
  <div class="sub" style="font-size:12px;margin-top:6px"><span class="dot ok"></span> real &nbsp; <span class="dot wait"></span> simulator &nbsp;· score to par, normalized to 18 holes</div>`;
}

/* ----- course import: scorecard photo (needs an Anthropic API key in Settings) or pasted JSON ----- */
const COURSE_PROMPT=`Read this golf scorecard and return ONLY a JSON object, no prose, no markdown fences, in exactly this shape:
{"name":"Course name","pars":[18 integers, hole 1 to 18],"si":[18 integers, the handicap/stroke index of each hole, 1=hardest],"tees":[{"name":"Blue","rating":72.4,"slope":131,"yards":[18 integers]}]}
Include every tee set printed on the card. Use the men's/course rating and slope for each tee if printed; otherwise use null. If only 9 holes are printed, return 9 pars and 9 yards.`;
function applyCourseJSON(txt){let j;try{j=JSON.parse(String(txt).replace(/```json|```/g,'').trim())}catch(e){toast('That was not valid course JSON');return false}
  if(!j||!Array.isArray(j.pars)){toast('Missing "pars" in the data');return false}
  const n=j.pars.length;const pad=a=>{a=(a||[]).map(x=>+x||0);while(a.length<18)a.push(0);return a.slice(0,18)};
  const c=sub.edit;c.name=j.name||c.name;c.pars=pad(j.pars).map(x=>x||4);if(Array.isArray(j.si))c.si=pad(j.si).map((x,i)=>x||i+1);
  if(Array.isArray(j.tees)&&j.tees.length)c.tees=j.tees.map(t=>({id:uid(),name:t.name||'Tee',rating:t.rating?+t.rating:null,slope:t.slope?+t.slope:null,yds:pad(t.yards||t.yds)}));
  sub.tab='par';render();toast(n<18?'Only '+n+' holes read — fill in the rest':'Check the numbers, then save');return true}
function pasteCourse(){openSheet(`<h2 style="margin-top:0">Paste course data</h2>
  <p class="sub" style="margin:0 0 8px">No API key? Take a photo of the scorecard, send it to Claude with the prompt below, and paste the JSON it returns here.</p>
  <button class="btn small block" onclick="navigator.clipboard?.writeText(COURSE_PROMPT).then(()=>toast('Prompt copied'))">Copy the prompt for Claude</button>
  <label class="f">JSON</label><textarea class="in" id="cjson" style="min-height:140px;font-family:ui-monospace,monospace;font-size:13px"></textarea>
  <button class="btn primary block" style="margin-top:12px" onclick="if(applyCourseJSON(document.getElementById('cjson').value))closeSheet()">Fill in course</button>`)}
async function scanScorecard(file){if(!file)return;const key=DB.settings.apiKey;if(!key){toast('Add an Anthropic API key in Settings, or use Paste course data');return}
  if(!navigator.onLine){toast('Scanning needs a connection');return}
  toast('Reading scorecard…');
  const b64=await new Promise(res=>{const img=new Image();img.onload=()=>{const M=1600,sc=Math.min(1,M/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',0.85).split(',')[1])};img.src=URL.createObjectURL(file)});
  try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:DB.settings.model||'claude-sonnet-5',max_tokens:1500,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:COURSE_PROMPT}]}]})});
    const j=await r.json();if(j.error)throw new Error(j.error.message||'API error');
    applyCourseJSON((j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join(''))}
  catch(e){toast('Scan failed: '+(e.message||e))}}

/* ===================== GAMES ===================== */
const GAMES={
  skins:{name:'Skins',min:2,max:8,teams:false,wagerLabel:'Per skin, per player',blurb:'Low score wins the hole; ties carry.'},
  nassau:{name:'Nassau',min:2,max:4,teams:true,sides:2,wagerLabel:'Per segment',blurb:'Three matches: front, back, total.'},
  wolf:{name:'Wolf',min:4,max:4,teams:false,wagerLabel:'Per point',blurb:'Wolf rotates and picks a partner, or goes alone.'},
  stableford:{name:'Stableford',min:1,max:8,teams:false,wagerLabel:'Per point',blurb:'Points by score vs par; high total wins.'},
  vegas:{name:'Vegas',min:4,max:4,teams:true,sides:2,size:2,wagerLabel:'Per point',blurb:'Two-digit team numbers; the flip rule bites.'},
  bestball:{name:'Best Ball',min:4,max:8,teams:true,sides:2,wagerLabel:'Per match',blurb:'Team score is the best ball on each hole.'},
  scramble:{name:'Scramble',min:4,max:8,teams:true,sides:2,wagerLabel:'Per match',blurb:'One score per team per hole.'}
};
const STAB=[[-3,5],[-2,4],[-1,3],[0,2],[1,1]];           // standard
const STAB_MOD=[[-3,8],[-2,5],[-1,2],[0,0],[1,-1]];      // modified
function stabPts(toPar,mod){const t=mod?STAB_MOD:STAB;for(const [d,p] of t)if(toPar<=d)return p;return mod?-3:0}
function playerName(id){const p=DB.players.find(x=>x.id===id);return p?p.name:'?'}
function courseHcp(idx,tee,par){if(idx==null)return 0;
  return (tee&&tee.rating&&tee.slope)?Math.round(idx*tee.slope/113+(tee.rating-par)):Math.round(idx)}
/* strokes each player gets on each hole, played off the low course handicap */
function strokeTable(g){
  const c=DB.courses.find(x=>x.id===g.courseId);const tee=c?(c.tees.find(t=>t.id===g.teeId)||c.tees[0]):null;
  const si=courseSI(c),par=c?coursePar(c):72;
  const chs={};g.playerIds.forEach(id=>{const p=DB.players.find(x=>x.id===id);chs[id]=courseHcp(p?p.index:null,tee,par)});
  const low=Math.min(...Object.values(chs));const out={};
  g.playerIds.forEach(id=>{let given=Math.max(0,chs[id]-low);if(g.holes.length<=9)given=Math.round(given/2);
    out[id]={ch:chs[id],given,per:g.holes.map(h=>{const s=si[h.n-1]||h.n;return Math.floor(given/18)+((given%18)>=s?1:0)})}});
  return out;
}
function gScore(g,hi,pid,st){const raw=g.holes[hi].scores[pid];if(raw==null||raw<=0)return null;
  return g.net?raw-(st[pid]?st[pid].per[hi]:0):raw}
function holeDone(g,hi){const h=g.holes[hi];return g.type==='scramble'?g.sides.some((s,i)=>h.team&&h.team[i]>0):g.playerIds.every(p=>h.scores[p]>0)}
function sideScore(g,hi,si_,st){const h=g.holes[hi];
  if(g.type==='scramble')return h.team&&h.team[si_]>0?h.team[si_]:null;
  const vals=g.sides[si_].map(p=>gScore(g,hi,p,st)).filter(v=>v!=null);return vals.length?Math.min(...vals):null}

/* ---- the engine: returns per-hole detail, points and money per player ---- */
function playGame(g){
  const st=strokeTable(g),n=g.playerIds.length,money={},pts={},lines=[];
  g.playerIds.forEach(p=>{money[p]=0;pts[p]=0});
  const done=g.holes.map((h,i)=>holeDone(g,i));
  const detail=g.holes.map(()=>({}));
  const pv=(a,b)=>{money[a]+=b};

  if(g.type==='skins'){let carry=0;
    g.holes.forEach((h,i)=>{if(!done[i]){detail[i]={text:''};return}
      const sc={};g.playerIds.forEach(p=>sc[p]=gScore(g,i,p,st));
      const lo=Math.min(...Object.values(sc));const win=g.playerIds.filter(p=>sc[p]===lo);
      let value=carry+1;
      if(win.length!==1){carry=value;detail[i]={text:`tied — ${value} on the next hole`};return}
      const w=win[0];
      if(g.validate&&lo>h.par){carry=value;detail[i]={text:`${playerName(w)} low but over par — not validated, ${value} carries`};return}
      let mult=1;if(g.multiplier){const gross=g.holes[i].scores[w]-h.par;if(gross<=-2)mult=3;else if(gross===-1)mult=2}
      const paid=value*mult;carry=0;pts[w]+=paid;
      g.playerIds.forEach(p=>{if(p!==w)pv(p,-g.wager*paid)});pv(w,g.wager*paid*(n-1));
      detail[i]={win:w,text:`${playerName(w)} wins ${paid} skin${paid>1?'s':''}${mult>1?' (×'+mult+')':''}`}});
    if(carry)lines.push(`${carry} skin${carry>1?'s':''} left on the table`);
  }

  else if(g.type==='stableford'){
    g.holes.forEach((h,i)=>{if(!done[i])return;const d={};
      g.playerIds.forEach(p=>{const v=gScore(g,i,p,st);if(v==null)return;const q=stabPts(v-h.par,g.modified);pts[p]+=q;d[p]=q});
      detail[i]={pp:d,text:g.playerIds.map(p=>playerName(p).split(' ')[0]+' '+(d[p]>=0?'+':'')+d[p]).join(' · ')}});
    const avg=Object.values(pts).reduce((a,b)=>a+b,0)/n;
    g.playerIds.forEach(p=>money[p]=+( (pts[p]-avg)*g.wager ).toFixed(2));
  }

  else if(g.type==='wolf'){
    g.holes.forEach((h,i)=>{if(!done[i])return;const w=g.playerIds[(h.n-1)%4];const pick=h.wolf&&h.wolf.partner;
      const lone=!pick||pick==='lone';
      const team=lone?[w]:[w,pick],opp=g.playerIds.filter(p=>!team.includes(p));
      const best=a=>Math.min(...a.map(p=>gScore(g,i,p,st)).filter(v=>v!=null));
      const tb=best(team),ob=best(opp);if(!isFinite(tb)||!isFinite(ob))return;
      let txt;
      if(tb===ob)txt='Halved';
      else{const wolfWon=tb<ob;
        if(lone){const sign=wolfWon?1:-1;pts[w]+=sign*2*opp.length;opp.forEach(p=>pts[p]-=sign*2);
          txt=wolfWon?`Lone wolf wins 2 from each`:`Lone wolf loses 2 to each`}
        else{const win=wolfWon?team:opp,lose=wolfWon?opp:team;win.forEach(p=>pts[p]+=1);lose.forEach(p=>pts[p]-=1);
          txt=wolfWon?'Wolf side wins':'Opponents win'}}
      detail[i]={wolf:w,lone,text:`${playerName(w).split(' ')[0]} is wolf${lone?' (alone)':' with '+playerName(pick).split(' ')[0]} — ${txt}`}});
    g.playerIds.forEach(p=>money[p]=+(pts[p]*g.wager).toFixed(2));
  }

  else if(g.type==='vegas'){
    let net=0;
    g.holes.forEach((h,i)=>{if(!done[i])return;
      const num=(side,flip)=>{let a=g.sides[side].map(p=>gScore(g,i,p,st)).sort((x,y)=>x-y);
        let s=a.map(v=>Math.min(v,9)).join('');if(flip)s=s.split('').reverse().join('');return +s};
      const birdieFlip=side=>{const ps=g.sides[side];return ps.some(p=>{const gross=g.holes[i].scores[p];if(gross==null||gross-h.par>-1)return false;
        return ps.some(q=>q!==p&&g.holes[i].scores[q]>gross)})};
      const A=num(0,g.flip&&birdieFlip(1)),B=num(1,g.flip&&birdieFlip(0));
      const diff=Math.abs(A-B);if(!diff){detail[i]={text:`${A} vs ${B} — push`};return}
      const win=A<B?0:1;net+=win===0?diff:-diff;
      g.sides[win].forEach(p=>pts[p]+=diff);g.sides[1-win].forEach(p=>pts[p]-=diff);
      detail[i]={text:`${A} vs ${B} — side ${win+1} +${diff}`}});
    g.sides.forEach((side,i)=>side.forEach(p=>money[p]=+(((i===0?net:-net))*g.wager).toFixed(2)));
  }

  else{ // nassau / bestball / scramble — match play
    const segs=g.type==='nassau'?[[0,8,'Front'],[9,17,'Back'],[0,17,'Total']]:[[0,g.holes.length-1,'Match']];
    const res=[];
    segs.forEach(([a,b,label])=>{if(g.holes.length<18&&label!=='Total'&&label!=='Match'&&a>=g.holes.length)return;
      let up=0,played=0;
      for(let i=a;i<=Math.min(b,g.holes.length-1);i++){if(!done[i])continue;played++;
        const x=sideScore(g,i,0,st),y=sideScore(g,i,1,st);if(x==null||y==null)continue;
        if(x<y)up++;else if(y<x)up--}
      res.push({label,up,played})});
    (g.presses||[]).forEach(pr=>{let up=0;for(let i=pr.from-1;i<=Math.min(pr.to-1,g.holes.length-1);i++){if(!done[i])continue;
      const x=sideScore(g,i,0,st),y=sideScore(g,i,1,st);if(x==null||y==null)continue;if(x<y)up++;else if(y<x)up--}
      res.push({label:`Press h${pr.from}–${pr.to}`,up,played:1,press:true})});
    res.forEach(r=>{if(!r.played||!r.up)return;const win=r.up>0?0:1;
      g.sides[win].forEach(p=>pv(p,g.wager*g.sides[1-win].length));
      g.sides[1-win].forEach(p=>pv(p,-g.wager*g.sides[win].length))});
    g.holes.forEach((h,i)=>{if(!done[i])return;const x=sideScore(g,i,0,st),y=sideScore(g,i,1,st);
      detail[i]={text:x==null||y==null?'':`${x} vs ${y} — ${x<y?'side 1':y<x?'side 2':'halved'}`}});
    lines.push(...res.filter(r=>r.played).map(r=>`${r.label}: ${r.up===0?'all square':(Math.abs(r.up)+' up '+(r.up>0?'side 1':'side 2'))}`));
    detail.segs=res;
  }
  return {st,money,pts,detail,lines,done};
}

function startGame(){const f=sub.newgame,G=GAMES[f.type];
  if(f.playerIds.length<G.min||f.playerIds.length>G.max)return toast(`${G.name} needs ${G.min===G.max?G.min:G.min+'–'+G.max} players`);
  const c=DB.courses.find(x=>x.id===f.courseId);const tee=c?(c.tees.find(t=>t.id===f.teeId)||c.tees[0]):null;
  const start=f.span==='B9'?10:1,count=f.span==='18'?18:9;
  const holes=[];for(let i=0;i<count;i++){const n=start+i;holes.push({n,par:c?(c.pars[n-1]||4):4,scores:{},team:[0,0],wolf:null})}
  f.playerIds.forEach(()=>{});
  const g={id:uid(),createdAt:Date.now(),date:f.date,type:f.type,wager:+f.wager||0,net:f.net,playerIds:f.playerIds.slice(),

    validate:f.validate,multiplier:f.multiplier,modified:f.modified,flip:f.flip,roundId:DB.active?.id||null};
  if(GAMES[f.type].teams){g.sides=[[],[]];f.playerIds.forEach((p,i)=>g.sides[teamOf(i)].push(p))}

const RULES=[
 {k:'skins',t:'Skins',who:'2–4+ players · hole by hole',
  r:['Every hole is worth one skin.','Outright low score on the hole wins it. Any tie and nobody wins.','A tied hole carries: its skin is added to the next hole, and carries stack.','If the last hole ties, most groups either void those skins or settle them on a playoff hole.'],
  v:['<b>Net skins:</b> handicap strokes apply, so higher handicaps can win the hard holes.','<b>Validation:</b> a skin only counts if won with par or better.','<b>Birdie multiplier:</b> a skin won with a birdie pays double, an eagle triple — including any carries it absorbed. A hole worth 3 after two carries, won with a birdie, pays 6.'],
  app:'Carries are automatic. Validation and the multiplier are toggles when you set the game up. The winner collects the pot from every other player.'},
 {k:'nassau',t:'Nassau',who:'2 players or two 2-man teams · match play',
  r:['The round is three separate bets: front nine, back nine, and the full 18.','Each is usually for the same amount ($5-$5-$5).','Each is ordinary match play — win a hole, go one up; most holes won takes that bet.','They are fully independent: you can lose the front, win the back, and still take the overall.'],
  v:['<b>Automatic 2-down press:</b> a side that falls two down can call a new bet running from that hole to the end of the segment.','<b>Junk:</b> birdies, greenies and sandies are often stacked on top.'],
  app:'Press from hole N adds a new bet through the end of that nine and settles with the rest.'},
 {k:'wolf',t:'Wolf',who:'4 players · rotating partnerships',
  r:['Players tee off in a fixed rotation; the wolf role rotates in that same order, so player 1 is wolf on hole 1, player 2 on hole 2, and so on.','The wolf tees off first and watches the other three hit.','After each tee shot the wolf must decide immediately whether to take that player as a partner — before the next shot is struck.','Take a partner and it is 2 vs 2, better ball each side.','Like none of them, and the wolf declares Lone Wolf: 1 vs 3 for double points.','Partner win pays 1 point per player on the winning side. A lone wolf wins or loses 2 points against each opponent.'],
  v:['<b>Blind wolf:</b> Lone Wolf must be declared before anyone tees off.','<b>Pigs:</b> same idea, committed before seeing any shot.','<b>Money version:</b> convert points straight to a dollar value per point.'],
  app:'The rotation follows the order you picked the players. Tap a partner or Lone Wolf on each hole; points are zero-sum and money is points × wager.'},
 {k:'vegas',t:'Vegas',who:'4 players, two teams of 2 · team stroke play',
  r:['Each team joins its two scores into a two-digit number, low score first: a 4 and a 6 is 46, never 64.','The lower number wins the difference in points — 46 against 51 is a 5-point swing.','<b>The flip rule:</b> if a player makes birdie or better while their partner holds the higher digit, the opposing number is reversed before comparing, so a 56 becomes 65.','Points run across 18 holes and settle at an agreed value per point.'],
  v:['Some groups flip whenever one partner scores much worse than the other. House rules vary — agree before you tee off.'],
  app:'The flip is a toggle. It only fires when the birdie-maker\'s partner actually holds the higher digit.',
  note:'The flip makes this the highest-variance game here. A blow-up hole alongside a partner\'s birdie can swing 20+ points.'},
 {k:'stableford',t:'Stableford',who:'any number · individual points',
  r:['Points come from your score against par, not your total strokes.','Albatross 5, eagle 4, birdie 3, par 2, bogey 1, double or worse 0.','Highest total after 18 wins — the opposite of stroke play.','A disaster hole costs you 0 rather than wrecking the card, so there is no reason not to pick up.'],
  v:['<b>Modified (PGA Tour scale):</b> eagle +5, birdie +2, par 0, bogey −1, double or worse −3.','<b>Net Stableford:</b> apply handicap strokes before working out the points.'],
  app:'Standard or modified is a toggle, net is a toggle, and the money settles against the group average.'},
 {k:'bestball',t:'Best Ball (Four-Ball)',who:'teams of 2 · stroke or match play',
  r:['Everyone plays their own ball the whole way round.','The team score on a hole is simply the lowest of the teammates\' scores.','Score it as stroke play over the 18, or match play hole by hole against the other team\'s best ball.'],
  v:[], app:'Each side\'s low score is taken automatically from the scores you enter.',
  note:'Calmer than a scramble — normal golf, with a teammate as insurance on your bad holes.'},
 {k:'scramble',t:'Scramble (Texas Scramble)',who:'teams of 2–4 · one ball per shot',
  r:['Everyone tees off.','The team picks the best tee shot and all players hit their next from that spot.','Repeat — hit, pick the best, everyone plays from there — until it is holed.','One score per team per hole.'],
  v:['<b>Minimum drives:</b> tournaments often require each player\'s tee shot be used a set number of times, so one long hitter cannot carry every hole.','<b>Shamble:</b> scramble off the tee, then everyone plays their own ball in from there, best individual score counting.'],
  app:'One stepper per side, per hole.',
  note:'Forgiving and social — the usual choice for charity events and mixed-ability groups.'},
 {k:'bbb',t:'Bingo Bango Bongo',who:'any group, best as a foursome · points',
  r:['Three points on every hole, awarded independently of the score.','<b>Bingo:</b> first ball on the green.','<b>Bango:</b> closest to the pin once everyone is on the green.','<b>Bongo:</b> first ball in the hole.','A player can take none, some or all three.','Honours rotate by who is away, which naturally gives shorter hitters more shots at Bingo.'],
  v:[], note:'Rewards short game and putting over length, so it levels a mixed group.',app:null},
 {k:'snake',t:'Snake',who:'any number · side bet',
  r:['Three-putt a green and you have the snake.','It stays with you until somebody else three-putts.','Whoever holds it at the end of the round — or the end of the nine — pays the group.'],
  v:[], note:'Runs alongside whatever the main game is and does not affect it.',app:null},
 {k:'rabbit',t:'Rabbit',who:'any number · side bet',
  r:['Win a hole outright and you hold the rabbit — but it does not pay out yet.','It passes to the next player who wins a hole outright.','Whoever holds it at the end of the front nine, and again at the end of the back, collects for that half.','If the last hole before a checkpoint was tied, the rabbit is loose and nobody collects for that half.'],
  v:[], app:null},
 {k:'robin',t:'Round Robin',who:'4, 6 or 8 · rotating partnerships',
  r:['Partners change every few holes — in a foursome, usually every six (1–6, 7–12, 13–18), so you partner each player once.','Each segment is scored on its own, normally best-ball match play or points.','Results are tallied per player across all three segments.'],
  v:[], note:'Everyone plays with and against everyone, so one strong pairing cannot own the whole round.',app:null}
];
const SIDEBETS=[['Greenie','Closest to the pin on a par 3, in regulation.'],['Sandie','Par or better after being in a bunker.'],['Barkie','Par or better after hitting a tree.'],['Arnie','Par without ever finding the fairway.'],['Polie','Like a greenie, but for approach shots rather than par-3 tee shots.'],['Fish','A penalty for finding the water.']];
function rulesSheet(k){const x=RULES.find(r=>r.k===k);
  return `<div class="row between"><h2 style="margin:0">${x.t}</h2><button class="btn small" onclick="closeSheet()">Close</button></div>
  <p class="sub" style="margin:4px 0 10px">${x.who}</p>
  <ol style="margin:0;padding-left:20px">${x.r.map(i=>`<li style="margin-bottom:7px">${i}</li>`).join('')}</ol>
  ${x.app?`<p class="sub" style="margin-top:12px">${x.app}</p>`:''}`}
function vRules(){
  const open=sub.rule;
  if(open){const x=RULES.find(r=>r.k===open);
    return `<button class="btn small" onclick="sub.rule=null;render()">‹ Rules</button>
    <h1 style="margin-top:12px">${x.t}</h1><p class="sub" style="margin:-8px 0 14px">${x.who}</p>
    <div class="card"><h2 style="margin-top:0">How it works</h2><ol style="margin:0;padding-left:20px">${x.r.map(i=>`<li style="margin-bottom:7px">${i}</li>`).join('')}</ol></div>
    ${x.v&&x.v.length?`<div class="card"><h2 style="margin-top:0">Common variations</h2><ul style="margin:0;padding-left:20px">${x.v.map(i=>`<li style="margin-bottom:7px">${i}</li>`).join('')}</ul></div>`:''}
    ${x.note?`<div class="card" style="background:var(--green-soft);border-color:var(--green-soft)">${x.note}</div>`:''}
    ${x.app?`<div class="card"><h2 style="margin-top:0">In this app</h2>${x.app}</div>`:`<p class="sub">Not scored by the app yet — keep this one on the card.</p>`}
    ${GAMES[x.k]?`<button class="btn primary block" onclick="sub.rule=null;newGame();sub.newgame.type='${x.k}';render()">Start a ${x.t} game</button>`:''}`}
  return `<button class="btn small" onclick="sub.rules=null;render()">‹ Games</button>
  <h1 style="margin-top:12px">Rules</h1>
  <p class="sub" style="margin:-8px 0 12px">Scoring conventions vary by group — worth confirming house rules before you tee off.</p>
  <div class="card list" style="padding:0 14px">${RULES.map(x=>`<button class="item" onclick="sub.rule='${x.k}';render()"><div class="grow"><div style="font-weight:600">${x.t}${GAMES[x.k]?'':' <span class="badge gray">not scored</span>'}</div><div class="sub">${x.who}</div></div><span class="sub">›</span></button>`).join('')}</div>
  <h2>Side bets</h2>
  <div class="card" style="padding:6px 14px">${SIDEBETS.map(([n,d])=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${n}</b> — <span class="sub">${d}</span></div>`).join('')}
  <p class="sub" style="margin:8px 0">These stack on top of any of the games above.</p></div>`;
}

    <button class="btn small block" style="margin-top:10px" ${testing?'disabled':''} onclick="testSheet()">${testing?'<span class="spin"></span>Testing connection…':'Test connection'}</button>
  </div>
  <div class="card"><h2 style="margin-top:0">Scorecard scanning <span class="sub" style="font-weight:400">optional</span></h2>
    <p class="sub" style="margin:0 0 6px">Lets "Scan scorecard photo" in Courses read a card and fill in pars, yardages, rating and slope. Needs an API key from console.anthropic.com; costs a fraction of a cent per scan. The key is stored only on this phone.</p>
    <label class="f">Anthropic API key</label><input class="in" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(s.apiKey||'')}" onchange="DB.settings.apiKey=this.value.trim();save()">

  <div class="card"><h2 style="margin-top:0">Defaults for new rounds</h2>
    <label class="f">Round type</label><div class="seg"><button class="${s.defaultType==='Real'?'on':''}" onclick="DB.settings.defaultType='Real';save();render()">Real</button><button class="${s.defaultType==='Sim'?'on':''}" onclick="DB.settings.defaultType='Sim';save();render()">Simulator</button></div>
    <label class="f">Entry</label><div class="seg"><button class="${s.defaultMode==='shots'?'on':''}" onclick="DB.settings.defaultMode='shots';save();render()">Every shot</button><button class="${s.defaultMode==='quick'?'on':''}" onclick="DB.settings.defaultMode='quick';save();render()">Quick</button></div>
  </div>
  <div class="card"><h2 style="margin-top:0">Backup</h2>
    <p class="sub" style="margin:0 0 10px">Everything lives on this phone. Export a backup now and then.</p>
    <div class="stack"><button class="btn block" onclick="exportJSON()">Export backup file</button><button class="btn block" onclick="copyJSON()">Copy backup to clipboard</button>
    <label class="btn block" style="cursor:pointer">Restore from file<input type="file" accept="application/json,.json" style="display:none" onchange="restoreFile(this.files[0])"></label>
    <button class="btn block" onclick="restorePaste()">Restore from pasted text</button></div>
  </div>
  <div class="card"><h2 style="margin-top:0">Sample data</h2>
    <p class="sub" style="margin:0 0 10px">Twenty made-up rounds so you can see the stats and the sheet. Remove them before you start logging for real.</p>
    <div class="stack">${DB.rounds.some(r=>r.sample)?`<button class="btn block" onclick="removeSamples()">Remove sample rounds</button>`:`<button class="btn block" onclick="loadSamples()">Load 20 sample rounds</button>`}</div>
  </div>
  <p class="sub" style="text-align:center">Golf Log v2 · ${DB.rounds.length} rounds · ${DB.courses.length} courses</p>`;
}
let testing=false;
async function testSheet(){if(testing)return;const url=DB.settings.sheetUrl;if(!url)return toast('Paste the script URL first');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url))return toast('URL should start with https://script.google.com/macros/s/ and end with /exec');
  testing=true;render();toast('Testing connection…',true);try{await testSheetInner(url)}finally{testing=false;render()}}
async function testSheetInner(url){let r,j;
  try{r=await fetch(url+'?ping=1',{method:'GET',redirect:'follow'})}catch(e){return toast('GET failed: '+(e.message||e))}
  try{j=await r.json()}catch(e){return toast('Script replied but not JSON (status '+r.status+') — access is probably not "Anyone"')}
  if(!j.ok)return toast('Script error: '+(j.error||'not ok'));
  try{r=await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({ping:true})});j=await r.json();toast(j.ok?'Connected ✓ (GET and POST both work)':'POST replied but not OK')}catch(e){toast('GET works, POST failed: '+(e.message||e))}}
function exportJSON(){const b=new Blob([JSON.stringify(DB)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`golflog-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove()}
function copyJSON(){navigator.clipboard?.writeText(JSON.stringify(DB)).then(()=>toast('Backup copied'),()=>toast('Copy blocked — use export'))}
function restoreFile(f){if(!f)return;const r=new FileReader();r.onload=()=>restoreText(r.result);r.readAsText(f)}
function restorePaste(){const t=prompt('Paste backup text');if(t)restoreText(t)}
function restoreText(t){try{const d=JSON.parse(t);if(!d.rounds)throw 0;if(!confirm(`Restore ${d.rounds.length} rounds and ${(d.courses||[]).length} courses? This replaces what's on the phone.`))return;DB={...DB,...d};save();toast('Restored');render()}catch(e){toast('That did not look like a backup')}}


/* ===================== sample data ===================== */
function loadSamples(){
  let seed=20260915;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
  const pick=a=>a[Math.floor(rnd()*a.length)];const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const courses=[
    {id:'smp-tp',name:'Thanksgiving Point – Blue',rating:73.1,slope:130,pars:[4,5,4,3,4,4,3,5,4,4,3,5,4,4,3,4,5,4],yds:[412,548,398,178,430,388,162,532,410,395,190,560,402,371,205,441,527,433]},
    {id:'smp-hc',name:'Hobble Creek – Blue',rating:70.9,slope:125,pars:[4,4,3,5,4,3,4,5,4,4,3,4,5,4,3,4,4,5],yds:[380,402,165,505,425,150,398,540,410,372,172,395,522,388,181,401,417,515]},
    {id:'smp-pb',name:'Sim – Pebble Beach',rating:74.7,slope:144,pars:[4,5,4,4,3,5,3,4,4,4,4,3,4,5,4,4,3,5],yds:[381,502,390,331,195,513,106,428,481,446,390,202,404,580,397,403,178,543]},
    {id:'smp-bd',name:'Sim – Bandon Dunes',rating:74.4,slope:145,pars:[4,3,4,4,4,3,4,4,4,4,4,3,5,4,3,4,4,5],yds:[381,193,398,410,462,161,393,431,432,407,393,205,533,371,143,412,380,532]}];
  courses.forEach(c=>{if(!DB.courses.find(x=>x.id===c.id)){const m=/^(.*?) – (.+)$/.exec(c.name);DB.courses.push({id:c.id,name:m?m[1]:c.name,pars:c.pars.slice(),tees:[{id:c.id+'-t',name:m?m[2]:'Default',rating:c.rating,slope:c.slope,yds:c.yds.slice()}]})}});
  const dates=[];let d=new Date(2026,5,14);for(let i=0;i<20;i++){dates.push(new Date(d));d.setDate(d.getDate()+ri(3,6))}
  const plan=dates.map((dt,i)=>({dt,type:i%5===2||i%5===4?'Sim':'Real',mode:i===6||i===13||i===17?'quick':'shots'}));
  plan.forEach((pl,idx)=>{
    const c=pl.type==='Sim'?pick(courses.slice(2)):pick(courses.slice(0,2));const sim=pl.type==='Sim';
    const skill=0.6+idx*0.006+(sim?0.05:0);
    const holes=c.pars.map((par,i)=>{
      const h={n:i+1,par,yds:c.yds[i],mode:pl.mode,shots:[],putts:0,score:0,fir:null,gir:null,pen:0};
      const shot=(club,good,lie)=>{const r=rnd();let res;if(r<good)res='good';else if(r<good+0.03)res='pen';else res=pick(['left','left','right','right','short','long']);
        const strike=rnd()<0.6?null:pick(['Center','Center','Heel','Heel','Heel','Toe','Thin','Fat']);h.shots.push({club,result:res,lie,strike,prox:null});return res};
      let onGreen=false;
      if(par>=4){let r=shot(par===5||rnd()<0.75?'Dr':'3W',skill,'Tee');if(r==='pen')r=shot('Dr',skill+0.15,'Tee');
        let lie=r==='good'?'Fairway':'Rough';
        if(par===5){let r2=shot(pick(['3W','Hy','4i']),skill-0.05,lie);if(r2==='pen')r2=shot('Hy',skill,lie);lie=r2==='good'?'Fairway':'Rough';
          const a=shot(pick(['PW','50','54']),skill+0.15,lie);if(a==='good'){onGreen=true;h.shots[h.shots.length-1].prox=ri(6,45)}}
        else{const a=shot(pick(['7i','8i','9i','PW','50']),skill+0.05,lie);if(a==='good'){onGreen=true;h.shots[h.shots.length-1].prox=ri(6,40)}}}
      else{const a=shot(pick(['5i','6i','7i','8i']),skill+0.05,'Tee');if(a==='good'){onGreen=true;h.shots[h.shots.length-1].prox=ri(8,40)}}
      let tries=0;while(!onGreen&&tries<3){tries++;const ch=shot(pick(['54','58','58']),0.85,pick(['Rough','Rough','Sand','Fringe']));if(ch==='good'){onGreen=true;h.shots[h.shots.length-1].prox=ri(2,15)}}
      const prox=h.shots[h.shots.length-1].prox||20;const r=rnd();
      h.putts=prox<=4?(r<0.95?1:2):prox<=12?(r<0.62?1:2):prox<=30?(r<0.15?1:r<0.95?2:3):(r<0.03?1:r<0.86?2:3);
      if(pl.mode==='quick'){h.mode='shots';const x=holeCalc(h);h.mode='quick';h.score=x.score;h.pen=x.pen;h.fir=x.fir;h.gir=x.gir;h.girMiss=x.girMiss;h.touched=true;h.shots=[]}
      return h});
    const r={id:'smp-'+idx,sample:true,date:pl.dt.getFullYear()+'-'+String(pl.dt.getMonth()+1).padStart(2,'0')+'-'+String(pl.dt.getDate()).padStart(2,'0'),courseId:c.id,teeId:c.id+'-t',teeName:(/ – (.+)$/.exec(c.name)||[])[1]||'',courseName:c.name,type:pl.type,mode:pl.mode,rating:c.rating,slope:c.slope,holes,notes:idx===5?'Front nine OB x2, back nine clean':idx===11?'Best ball striking of the summer':'',pushed:false,createdAt:pl.dt.getTime()};
    if(!DB.rounds.find(x=>x.id===r.id))DB.rounds.push(r);
  });
  save();toast('20 sample rounds loaded');render();
}
function removeSamples(){DB.rounds=DB.rounds.filter(r=>!r.sample);DB.courses=DB.courses.filter(c=>!String(c.id).startsWith('smp-'));save();toast('Sample rounds removed');render()}

/* ===================== sheet (modal) ===================== */
function openSheet(html){closeSheet();const d=document.createElement('div');d.className='sheet';d.id='sheet';d.innerHTML=`<div class="pane">${html}</div>`;d.addEventListener('click',e=>{if(e.target===d)closeSheet()});document.body.appendChild(d)}
function closeSheet(){document.getElementById('sheet')?.remove()}

load();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
